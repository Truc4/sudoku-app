name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-but-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # One stable download link friends can reuse -- this release's assets get replaced every push.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built from the latest push to main. Debug build, not from the Play Store -- Android will warn about installing an unknown app the first time.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
